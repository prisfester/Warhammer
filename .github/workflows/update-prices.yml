name: Automatisk Prisopdatering

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # Kører automatisk hver morgen kl. 06:00

jobs:
  scrape-and-update:
    runs-runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer biblioteker
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Kør scraper
        run: python scraper.py

      - name: Gem og push ændringer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "Automatisk prisopdatering" || exit 0
          git push
