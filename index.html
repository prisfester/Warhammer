<script>
        fetch('prices.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('product-container');
                container.innerHTML = '';

                data.forEach(prod => {
                    let offers = prod.offers || [];

                    // Sorterer så den billigste automatisk ligger øverst
                    offers.sort((a, b) => parseFloat(a.price) - parseFloat(b.price));

                    let offersHTML = '';

                    if (offers.length > 0) {
                        offersHTML = offers.map((offer, index) => {
                            // Håndterer om prisen er et tal eller en tekst
                            let rawPrice = offer.price;
                            let formattedPrice = typeof rawPrice === 'number' 
                                ? rawPrice.toFixed(2) + ' DKK' 
                                : rawPrice;

                            // Håndterer skiftende feltnavne fra scraperen
                            let storeName = offer.store || offer.shop || 'Webshop';
                            let storeLink = offer.link || offer.url || '#';

                            return `
                                <div class="offer-row">
                                    <div class="store-info">
                                        <span class="store-name">${storeName}</span>
                                        ${index === 0 ? '<span class="badge">Billigst</span>' : ''}
                                    </div>
                                    <div class="price-section">
                                        <span class="price">${formattedPrice}</span>
                                        <a href="${storeLink}" target="_blank" rel="nofollow sponsored" class="btn">Gå til shop</a>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    } else {
                        offersHTML = '<p style="color: #64748b; font-size: 0.9rem;">Ingen aktuelle tilbud fundet.</p>';
                    }

                    container.innerHTML += `
                        <div class="card">
                            <h2>${prod.name}</h2>
                            <div>${offersHTML}</div>
                        </div>
                    `;
                });
            })
            .catch(err => {
                console.error("Fejl:", err);
                document.getElementById('product-container').innerHTML = '<p>Der opstod en fejl ved hentning af priser.</p>';
            });
    </script>
