<script>
        fetch('prices.json')
            .then(res => res.json())
            .then(data => {
                console.log("Hentet data fra prices.json:", data);
                const container = document.getElementById('product-container');
                container.innerHTML = '';

                data.forEach(prod => {
                    // Tjekker om listen over tilbud hedder offers, prices, stores, shops eller deals
                    let offers = prod.offers || prod.prices || prod.stores || prod.shops || prod.deals || [];

                    // Sorterer tilbud efter pris, hvis prisen er numerisk
                    offers.sort((a, b) => {
                        let pA = parseFloat(String(a.price || a.pris || 0).replace(/[^0-9.,]/g, '').replace(',', '.'));
                        let pB = parseFloat(String(b.price || b.pris || 0).replace(/[^0-9.,]/g, '').replace(',', '.'));
                        return pA - pB;
                    });

                    let offersHTML = '';

                    if (offers.length > 0) {
                        offersHTML = offers.map((offer, index) => {
                            let rawPrice = offer.price || offer.pris || '–';
                            let storeName = offer.store || offer.shop || offer.butik || offer.webshop || 'Webshop';
                            let storeLink = offer.link || offer.url || offer.href || '#';

                            return `
                                <div class="offer-row">
                                    <div class="store-info">
                                        <span class="store-name">${storeName}</span>
                                        ${index === 0 ? '<span class="badge">Billigst</span>' : ''}
                                    </div>
                                    <div class="price-section">
                                        <span class="price">${rawPrice}</span>
                                        <a href="${storeLink}" target="_blank" rel="nofollow sponsored" class="btn">Gå til shop</a>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    } else {
                        offersHTML = '<p style="color: #64748b; font-size: 0.9rem; padding: 8px 0;">Ingen aktuelle tilbud registreret.</p>';
                    }

                    container.innerHTML += `
                        <div class="card">
                            <h2>${prod.name || prod.title || 'Produkt'}</h2>
                            <div>${offersHTML}</div>
                        </div>
                    `;
                });
            })
            .catch(err => {
                console.error("Fejl ved indlæsning:", err);
                document.getElementById('product-container').innerHTML = '<p>Der opstod en fejl ved hentning af priser.</p>';
            });
    </script>
